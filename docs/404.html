<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>González Fischer · Página no encontrada</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* Self-hosted Instrument Sans (OFL) — mirrors index.html so no visitor IP
     reaches Google Fonts. Paths are absolute: GitHub Pages serves this file
     for any unmatched path, so the URL bar can sit at any depth. */
  @font-face {
    font-family: 'Instrument Sans';
    font-style: normal;
    font-weight: 400 700;
    font-stretch: 100%;
    font-display: swap;
    src: url('/assets/fonts/instrument-sans-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Instrument Sans';
    font-style: normal;
    font-weight: 400 700;
    font-stretch: 100%;
    font-display: swap;
    src: url('/assets/fonts/instrument-sans-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root {
    --ink:   #16181b;  /* --gf-ink   — the footer's backdrop */
    --paper: #f2f3f2;  /* --gf-paper — --fg-inv, type on dark */
    --stone: #656a70;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }

  main { max-width: 30rem; width: 100%; }

  /* Matches the age gate's treatment (index.html): the logo is pre-gate
     content there too, shown above the age question itself. */
  .logo {
    height: 26px;
    width: auto;
    display: block;
    filter: invert(1) brightness(2.2);
    margin-bottom: 2.25rem;
  }

  .code {
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--stone);
    margin: 0 0 2rem;
  }

  p { margin: 0 0 1.15rem; line-height: 1.6; font-size: 1.0625rem; }
  p.en { color: var(--stone); }

  .back {
    margin-top: 2.5rem;
    padding-top: 1.75rem;
    border-top: 1px solid rgba(242,243,242,0.14);
  }

  a {
    color: var(--paper);
    text-decoration: none;
    border-bottom: 1px solid rgba(242,243,242,0.3);
    padding-bottom: 1px;
    transition: border-color 160ms ease-out;
  }
  a:hover { border-bottom-color: var(--paper); }

  .back a + a { margin-left: 1.5rem; }
</style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/logo.png" alt="González ♡ Fischer">

    <p class="code">Error 404</p>

    <p>Esta página no existe, o ya no está aquí.</p>
    <p class="en">This page doesn't exist, or is no longer here.</p>

    <div class="back">
      <a href="/">Inicio</a>
      <a href="/#wines">Los vinos</a>
    </div>
  </main>
</body>
</html>
